<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Jóvenes CANACINTRA</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e', // Verde vibrante CANACINTRA
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark-bg dark:text-gray-100 transition-colors duration-200 antialiased h-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="h-16 border-b border-gray-200 dark:border-dark-border bg-white/70 dark:bg-dark-card/70 backdrop-blur-md sticky top-0 z-50 flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-white p-1 rounded-lg shadow-sm border border-gray-100">
                <img src="https://yt3.googleusercontent.com/ytc/AIdro_lwFj1J7zL8C9n4u9Ua7bCjX0G-6k_wT5r_5X_8=s100-c-k-c0x00ffffff-no-rj" alt="CANACINTRA" class="h-8 w-8 object-contain rounded">
            </div>
            <h1 class="font-extrabold text-xl tracking-tight text-gray-800 dark:text-white uppercase">Jóvenes <span class="text-primary-600">CANACINTRA</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <button id="refresh-btn" class="flex items-center gap-2 text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white transition-colors">
                <i class="ph ph-arrows-clockwise text-lg"></i>
                <span class="hidden sm:inline">Actualizar</span>
            </button>
            <div class="h-4 w-px bg-gray-300 dark:bg-gray-700"></div>
            <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" aria-label="Toggle Theme">
                <i class="ph ph-moon text-xl dark:hidden"></i>
                <i class="ph ph-sun text-xl hidden dark:block"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto p-4 md:p-6 pb-20 custom-scrollbar">
        <div class="max-w-7xl mx-auto space-y-6" id="dashboard-container">
            <!-- Loading Skeleton -->
            <div class="animate-pulse space-y-6">
                <div class="flex justify-between items-center">
                    <div class="h-12 bg-gray-200 dark:bg-gray-800 rounded-2xl w-1/3"></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                    <div class="h-64 bg-gray-200 dark:bg-gray-800 rounded-3xl"></div>
                    <div class="h-64 bg-gray-200 dark:bg-gray-800 rounded-3xl"></div>
                    <div class="h-64 bg-gray-200 dark:bg-gray-800 rounded-3xl"></div>
                    <div class="h-64 bg-gray-200 dark:bg-gray-800 rounded-3xl"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Details Panel Sidebar -->
    <div id="details-panel" class="fixed inset-y-0 right-0 w-full md:w-96 bg-white/95 dark:bg-dark-card/95 backdrop-blur-xl border-l border-gray-200 dark:border-dark-border shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-50 flex flex-col">
        <!-- Panel content injected via JS -->
    </div>
    <!-- Overlay -->
    <div id="details-overlay" class="fixed inset-0 bg-black/20 dark:bg-black/40 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- Application Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/theme.js"></script>
    <script src="js/utils/api.js"></script>
    <script src="js/components/filters.js"></script>
    <script src="js/components/gallery.js"></script>
    <script src="js/components/detailsPanel.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
